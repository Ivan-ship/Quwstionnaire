<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/frontend/styles/style.css">


</head>
<body>
    <div class="wrapper">
        <form id="signon">
            <h1>Вход</h1>

            <div class="input-box">
                <input type="text" id="login_email" placeholder="Логин" required>
                <i class="bx bx-user"></i>
            </div>

            <div class="input-box">
                <input type = "password" id="login_password" placeholder="Пароль" required>
                <i class="bx bx-user"></i>
            </div>

            <div class="remember">
                <label for=""><input type = "checkbox">Запомнить меня</label>
                <a href="/password">Забыли пароль?</a>
            </div>

            <button type = "submit" class = "btn">Войти</button>

            <a href="http://127.0.0.1:8000/auth/yandex/login" class="yandex-login-btn">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2d/Yandex_logo.svg" alt="">
                Войти через Яндекс
            </a>
            <div class="register-account">
                <p>Ещё нету аккаунта? <a href="/register">Зарегистрироваться</a></p>
            </div>
        </form>
    </div>

    <script src="/frontend/js/main.js"></script>
</body>
</html>
