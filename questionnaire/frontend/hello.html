<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашняя страница</title>
</head>
<body>
    <div class="container">
        <h2>Выбирай Test+</h2>

       

        <button id = "createdTest" class="createdTest">Создать опрос</button>
        <button id = "takeTest" class="takeTest">Пройти опрос</button>
        
        <div class="profile">
            <div class="avatar" id="avatar">👤</div>

            <div class="dropdown" id="dropdown">
                <p id="userName"></p>
                <button id="logoutBtn" class="logoutBtn">Выйти</button>
            </div>
        </div>
    </div>
    <style>
        h2{
            text-align: center;
        }
        .profile {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        .avatar {
        width: 50px;
        height: 50px;
        background-color: #4CAF50;
        color: white;
        border-radius: 50%; 
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 24px;
        }

        .dropdown {
        display: none;
        position: absolute;
        right: 0;
        top: 60px;
        background: white;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 10px;
        width: 150px;
        text-align: center;
    }

    .dropdown button {
        margin-top: 10px;
        width: 100%;
        }
    .logoutBtn{
        background-color: red;
        color: white;
        border-radius: 10px;
        font-size: 14px;
        border: none;
    }
    .createdTest,
    .takeTest{
        background-color: aqua;
        border: none;
        border-radius: 8px;
        height: 50px;
        color: #000;
        border: none;
        outline: none;
        cursor: pointer;
        font-size: 20px;
        font-weight: 600;
        margin-top: 6px;
    }
    </style>

    <script src="/frontend/js/main.js"></script>
</body>
</html>
