<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
</head>
<body>
    <div class="container">
        <div class="title">Регистрация</div>
        <form action="#">
            <div class="user-detalis">
                <div class="input-box">
                    <span class="detalis">Имя</span>
                    <input type="text" placeholder="Введите имя" required>
                </div>

                <div class="input-box">
                    <span class="detalis">Фамилия</span>
                    <input type="text" placeholder="Введите фамилию" required>
                </div>

                <div class="input-box">
                    <span class="detalis">Email</span>
                    <input type="text" placeholder="Введите email" required>
                </div>

                <div class="input-box">
                    <span class="detalis">Введите пароль</span>
                    <input type="password" placeholder="Введите пароль" required>
                </div>

                <div class="input-box">
                    <span class="detalis">Подтвердите пароль</span>
                    <input type="password" placeholder="Подтвердите пароль" required>
                </div>
            </div>

            <div class="gender-detalis">
                <span class="gender-title">Пол</span>
                <div class="category">
                    <label for="">
                        <span class="dot-one"></span>
                        <span class="gender">Мужчина</span>
                    </label>

                    <label for="">
                        <span class="dot-one"></span>
                        <span class="gender">Женщина</span>
                    </label>
                </div>
            </div>

            <div class="button">
                <input type="submit" value="Зарегистрироваться">
            </div>
        </form>
    </div>
</body>
</html>
